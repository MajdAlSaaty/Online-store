[dir="ltr"] { font-family: var(--font-english); }

:root{--gold:oklch(.74 .1 82);--shadow:0 22px 55px -22px oklch(.3 .05 165/.4)}
body{font-size:15px;line-height:1.7}
.announcement{background:linear-gradient(90deg,oklch(.3 .07 166),var(--primary),oklch(.3 .07 166));font-size:13px;height:42px}
.store-header{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--background) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4)}
.header-main{height:84px}.brand-name{font-size:32px;letter-spacing:.06em}
.search-field{height:50px;border-radius:999px;background:var(--card)}.search-field input{font-size:14px}
.header-action,.nav-row,.nav-link{font-size:14px}.nav-link.is-active:after{background:var(--gold);height:3px;border-radius:3px}
.store-hero{border-radius:26px;box-shadow:var(--shadow)}.hero-pages{display:none}
.hero-copy h1{font-size:46px}.hero-copy p{font-size:15px}.hero-eyebrow{font-size:13px;color:var(--gold)}.hero-eyebrow:before{background:var(--gold)}
.hero-cta{height:54px;border-radius:999px;font-size:15px;padding-inline:34px;box-shadow:0 12px 28px -8px var(--primary)}
.benefit strong{font-size:14px}.benefit p{font-size:12.5px}
.section-heading h2{font-size:32px}.section-heading p,.eyebrow{font-size:13px}.eyebrow:before{background:var(--gold)}
.category-tab{font-size:14px;height:44px;border-radius:999px;padding:0 24px}.sort-field,.sort-field select{font-size:13px}
.product-grid{gap:26px}
.product-card{border-radius:22px;border-color:transparent;box-shadow:0 1px 0 var(--border),0 12px 32px -20px oklch(.3 .05 165/.45)}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.product-photo{aspect-ratio:1}.product-info{padding:18px}.product-meta{font-size:12px}.product-name{font-size:15px;height:auto;min-height:28px}
.product-price{font-size:20px}.product-price del{font-size:13px}.stock-label{font-size:12px}
.add-button,.favorite-button{width:44px;height:44px;border-radius:50%}.favorite-button{top:12px;inset-inline-end:12px}
.product-badge{font-size:12px;border-radius:99px;padding:4px 11px}.quick-view{border-radius:999px;font-size:13px}
@media(hover:none){.quick-view{opacity:1;transform:none}}
.modal,.cart-panel{border-radius:26px;box-shadow:var(--shadow)}
.checkout-form input,.checkout-form select,.checkout-form textarea,.tracker-input{font-size:15px;padding:14px;border-radius:14px;border:1px solid var(--input);background:var(--background);width:100%;color:var(--foreground)}
.cart-summary-row,.notice{font-size:14px}.btn.full{height:52px;border-radius:999px;font-size:15px}
.mobile-bottom{backdrop-filter:blur(16px)}
.wa-fab{position:fixed;inset-inline-start:18px;bottom:88px;z-index:45;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:27px;box-shadow:0 12px 28px -6px #25d366aa;text-decoration:none}
@media(min-width:761px){.store-hero{height:470px}}
@media(min-width:1101px){.category-tabs{display:none}.catalog-controls{justify-content:flex-end}}
@media(max-width:760px){.product-grid{gap:14px}.hero-copy h1{font-size:30px}.section-heading h2{font-size:24px}.store-hero{border-radius:20px}.product-info{padding:12px}.product-price{font-size:17px}}
